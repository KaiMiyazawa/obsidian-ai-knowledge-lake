[project]
name = "gmail-unifier"
version = "0.1.0"
description = "A local multi-account Gmail MCP with mailbox-bound replies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.170.0",
  "google-auth-oauthlib>=1.2.2",
  "keyring>=25.6.0",
  "mcp>=1.12.0,<2",
]

[project.scripts]
gmail-unifier = "gmail_unifier.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_unifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
