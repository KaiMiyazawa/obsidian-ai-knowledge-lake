[project]
name = "transcripter"
version = "0.1.0"
description = "ローカル完結の音声/動画 文字起こしツール（Whisper turbo / faster-whisper）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "transcripter" }]
dependencies = [
    "faster-whisper>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    # PDF → Markdown 変換（デフォルトバックエンド・軽量）
    "pymupdf4llm>=0.0.17",
    # Python 3.10 では tomllib が無いため tomli をフォールバックに使う
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
transcripter = "transcripter.cli:app"
tsc = "transcripter.cli:app"

[project.optional-dependencies]
# 高精度/スキャンPDF向けの任意バックエンド（重い・モデルDLあり）
docling = [
    "docling>=2.0.0",
]
# 日本語 形態素解析（字幕の語境界改行。fugashi + unidic-lite 辞書同梱）
morph = [
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
]
# 高精度な単語時刻（±50ms forced alignment）＋話者分離（pyannote）。重い・モデルDLあり
whisperx = [
    "whisperx>=3.1.0",
]
# ローカル Web UI（ドラッグ&ドロップで字幕生成）
webui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcripter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
